events {}

http {
  # Cân bằng tải Round-Robin giữa 2 Web Frontend Server theo đúng yêu cầu Mở rộng 10
  upstream web_backend {
    server web-frontend-server1:80;
    server web-frontend-server2:80;
  }

  server {
    listen 80;

    # 1. Web Frontend & Round Robin Load Balancing (Extension 10)
    location / {
      proxy_pass         http://web_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      add_header         X-Upstream-Addr   $upstream_addr always;
    }

    # 2. App API (strip /api/ prefix)
    location /api/ {
      proxy_pass         http://application-backend-server:8081/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 3. Keycloak Identity Provider
    location /auth/ {
      proxy_pass         http://authentication-identity-server:8080/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 4. Extension 9: direct /student shortcut (hỗ trợ cả /student và /student/)
    location /student {
      proxy_pass         http://application-backend-server:8081/student;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
