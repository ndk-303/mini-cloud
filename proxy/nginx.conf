events {}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;

    # Dynamic Load Balancing to all scaled web instances via Docker internal DNS
    location / {
      set $web_backend "http://web-frontend-server:80";
      proxy_pass         $web_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # App API (strip /api/ prefix)
    location /api/ {
      proxy_pass         http://application-backend-server:8081/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Keycloak
    location /auth/ {
      proxy_pass         http://authentication-identity-server:8080/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Extension 9: direct /student/ shortcut
    location /student/ {
      proxy_pass         http://application-backend-server:8081/student;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
