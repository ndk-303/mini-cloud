<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Blog Archive – MyMiniCloud</title>
  
  <!-- Typography: Newsreader (Editorial Serif) + Albert Sans (Bauhaus Modernist UI) + JetBrains Mono (Technical) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --bg: #FAF9F5;
      --bg-alt: #F2EFEB;
      --surface: #FFFFFF;
      --ink: #141413;
      --ink-muted: #696863;
      --ink-faint: #98968F;
      --border: #E5E2DA;
      --border-dark: #141413;
      --accent: #C2410C;
      --accent-hover: #9A3412;
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-sans: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
    }

    ::selection {
      background: var(--ink);
      color: var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Headings & Typographic Hierarchy */
    h1, h2, h3, .font-serif {
      font-family: var(--font-serif);
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.015em;
    }

    .font-mono {
      font-family: var(--font-mono);
      font-feature-settings: "tnum" 1;
    }

    /* Hairline borders & separators */
    .border-hairline {
      border-color: var(--border) !important;
    }
    .border-b-hairline {
      border-bottom: 1px solid var(--border);
    }
    .border-t-hairline {
      border-top: 1px solid var(--border);
    }

    /* Masthead Navigation */
    .masthead {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1020;
    }

    .masthead-brand {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .masthead-brand:hover {
      color: var(--accent);
    }

    .masthead-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border: 1px solid var(--border);
      color: var(--ink-muted);
      border-radius: 2px;
      background: var(--bg-alt);
    }

    .nav-editorial-link {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 0.6rem 0.8rem;
      transition: color 0.15s ease;
      display: inline-block;
    }
    .nav-editorial-link:hover, .nav-editorial-link.active {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1.5px;
    }

    /* Minimalist Modernist Buttons */
    .btn-modern-primary {
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      border-radius: 2px;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.55rem 1.25rem;
      transition: all 0.15s ease;
    }
    .btn-modern-primary:hover, .btn-modern-primary:focus {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .btn-modern-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.55rem 1.1rem;
      transition: all 0.15s ease;
    }
    .btn-modern-outline:hover {
      border-color: var(--ink);
      color: var(--ink);
      background: var(--bg-alt);
    }

    .btn-modern-sm {
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
    }

    /* Modernist Form Controls */
    .form-control, .form-select {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      padding: 0.65rem 0.85rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-control:focus, .form-select:focus {
      background-color: var(--surface);
      border-color: var(--ink);
      color: var(--ink);
      box-shadow: none;
      outline: 1px solid var(--ink);
    }

    /* User Role Badges */
    .role-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 2px;
    }
    .role-badge.admin {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    /* Modernist Modal Dialog */
    .modal-content.modern-modal {
      background: var(--bg);
      border: 1px solid var(--ink);
      border-radius: 2px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.12);
    }
    .modal-header.modern-header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
    }
    .modal-body.modern-body {
      padding: 1.5rem;
    }

    /* Content Area & Footer */
    .content-area {
      flex: 1;
    }

    footer.modern-footer {
      background: var(--bg);
      border-top: 1px solid var(--border);
      color: var(--ink-muted);
      font-size: 0.8rem;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: #D8D5CD;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B6B2A8;
    }
  </style>
</head>
<body>

<!-- Masthead -->
<header class="masthead py-3">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="d-flex align-items-center gap-2">
      <a class="masthead-brand" href="#home">
        <span>STUDENT BLOG</span>
      </a>
      <span class="masthead-tag font-mono">ARCHIVE / v2</span>
    </div>

    <nav class="d-flex align-items-center gap-1" id="nav-links"></nav>

    <div class="d-flex align-items-center" id="nav-auth"></div>
  </div>
</header>

<!-- Main Container -->
<main class="container my-4 my-md-5 content-area" id="app">
  <div class="text-center py-5">
    <div class="spinner-border spinner-border-sm text-dark" role="status"></div>
    <div class="mt-2 font-mono small text-muted">LOADING ARCHIVE...</div>
  </div>
</main>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modern-modal">
      <div class="modal-header modern-header d-flex justify-content-between align-items-center">
        <div>
          <span class="font-mono text-muted small d-block mb-1">00 / AUTHENTICATION</span>
          <h4 class="h5 mb-0 fw-semibold" id="loginModalLabel">Đăng nhập tài khoản</h4>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>
      <div class="modal-body modern-body">
        <p class="text-muted small mb-4">
          Xác thực qua Keycloak OIDC. Sinh viên: <code>SV001</code>–<code>SV005</code> (mật khẩu <code>student123</code>). Admin: <code>admin</code> (mật khẩu <code>admin</code>).
        </p>
        <div class="alert alert-danger d-none py-2 small font-mono rounded-0" id="login-error"></div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-uppercase font-mono" for="login-username">Mã số SV / Username</label>
            <input type="text" class="form-control" id="login-username" placeholder="Ví dụ: SV001 hoặc admin" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold text-uppercase font-mono" for="login-password">Mật khẩu</label>
            <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-modern-primary w-100 py-2">
            Xác thực & Đăng nhập
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modernist Colophon Footer -->
<footer class="modern-footer py-4 mt-5">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="font-mono small">
      MYMINICLOUD ARCHIVE &copy; 2026 &mdash; TON DUC THANG UNIVERSITY
    </div>
    <div class="font-mono small text-muted">
      SWISS EDITORIAL &middot; 9-NODE TOPOLOGY
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
