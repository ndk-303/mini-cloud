<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Blog Platform – MyMiniCloud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar-brand {
      letter-spacing: 0.5px;
    }
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .blog-img {
      height: 190px;
      object-fit: cover;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .blog-placeholder-img {
      height: 190px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .content-area {
      flex: 1;
    }
    footer {
      margin-top: auto;
      background: #1e293b;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2" href="#home">
      <i class="bi bi-mortarboard-fill text-primary fs-4"></i> Student Blog
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="nav-links"></ul>
      <div id="nav-auth"></div>
    </div>
  </div>
</nav>

<!-- Main Container -->
<main class="container my-4 content-area" id="app">
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="mt-2 text-muted">Đang tải ứng dụng...</div>
  </div>
</main>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="loginModalLabel">
          <i class="bi bi-shield-lock-fill text-primary me-2"></i>Đăng nhập hệ thống
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <p class="text-muted small mb-3">Sử dụng tài khoản Sinh viên (<code>SV001</code>–<code>SV005</code>/<code>student123</code>) hoặc Admin (<code>admin</code>/<code>admin</code>).</p>
        <div class="alert alert-danger d-none py-2" id="login-error"></div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="login-username">Tên đăng nhập / MSSV</label>
            <input type="text" class="form-control" id="login-username" placeholder="Ví dụ: SV001 hoặc admin" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="login-password">Mật khẩu</label>
            <input type="password" class="form-control" id="login-password" placeholder="Nhập mật khẩu" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Đăng nhập
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="py-3 text-center small">
  <div class="container">
    <span>MyMiniCloud Simulation Platform &copy; 2026 – Ton Duc Thang University</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
