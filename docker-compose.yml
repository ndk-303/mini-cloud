networks:
  cloud-net:
    name: cloud-net

services:
  # ── 1a. Web Frontend Instance 1 ──────────
  web-frontend-server1:
    build: ./web
    image: ${DOCKER_USER:-hotensv}/minicloud-web:latest
    container_name: web-frontend-server1
    ports: ["8001:80"]
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/conf.default:/etc/nginx/conf.d/default.conf:ro
    networks:
      cloud-net:
        aliases:
          - web-frontend-server
          - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M

  # ── 1b. Web Frontend Instance 2 ──────────
  web-frontend-server2:
    image: ${DOCKER_USER:-hotensv}/minicloud-web:latest
    pull_policy: never
    container_name: web-frontend-server2
    ports: ["8002:80"]
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/conf.default:/etc/nginx/conf.d/default.conf:ro
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M

  # ── 2. Application Backend ────────────────────
  application-backend-server:
    build: ./app
    image: ${DOCKER_USER:-hotensv}/minicloud-app:latest
    container_name: application-backend-server
    networks:
      cloud-net:
        aliases:
          - app-server
          - app
    ports: ["8081:8081"]
    environment:
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/${KEYCLOAK_REALM:-realm_SV001}"
      OIDC_AUDIENCE: "flask-app"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  # ── 3. Relational Database ─────────────────────────────────
  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    command: [
      "mariadbd",
      "--performance_schema=OFF",
      "--innodb_buffer_pool_size=64M",
      "--innodb_log_buffer_size=8M",
      "--max_connections=20"
    ]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["3306:3306"]
    networks:
      cloud-net:
        aliases:
          - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 180M

  db-schema-migration:
    image: mariadb:11
    depends_on:
      - relational-database-server
    environment:
      MYSQL_PWD: root
    volumes:
      - ./db/init/003_blogs.sql:/migration.sql:ro
    command:
      - /bin/bash
      - -ec
      - |
        for attempt in {1..60}; do
          if mariadb -h relational-database-server -u root -e 'SELECT 1' >/dev/null 2>&1; then
            mariadb -h relational-database-server -u root < /migration.sql
            exit 0
          fi
          sleep 2
        done
        echo 'MariaDB did not become ready for schema migration' >&2
        exit 1
    networks: [cloud-net]
    restart: "no"
  # ── 4. Authentication / Identity ───────────────────────────
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Djava.security.egd=file:/dev/./urandom -Xms64m -Xmx288m -XX:MetaspaceSize=128M -XX:MaxMetaspaceSize=256m"
    ports: ["8080:8080"]
    restart: unless-stopped
    networks:
      cloud-net:
        aliases:
          - keycloak
    deploy:
      resources:
        limits:
          memory: 580M

  keycloak-bootstrap:
    image: ${DOCKER_USER:-hotensv}/minicloud-app:latest
    pull_policy: never
    depends_on:
      - authentication-identity-server
    command: ["python", "setup_keycloak.py"]
    environment:
      KEYCLOAK_BASE_URL: http://authentication-identity-server:8080
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-realm_SV001}
      SV01_PASSWORD: ${SV01_PASSWORD:-student123}
      SV02_PASSWORD: ${SV02_PASSWORD:-student123}
    networks: [cloud-net]
    restart: "no"

  # ── 5. Object Storage (MinIO, required by the course rubric) ──
  minio:
    image: ghcr.io/intikhab49/minio-from-source:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./storage/data:/data
    ports: ["9000:9000", "9001:9001"]
    networks:
      cloud-net:
        aliases: [object-storage-server]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 180M

  minio-bootstrap:
    image: ghcr.io/intikhab49/minio-from-source:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./storage/init-minio.sh:/init-minio.sh:ro
      - ./storage/avatar.jpg:/seed/avatar.jpg:ro
      - ./storage/sample-report.pdf:/seed/sample-report.pdf:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks: [cloud-net]
    restart: "no"

  # ── 6. Internal DNS ────────────────────────────────────────
  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports: ["1053:53/udp"]
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      cloud-net:
        aliases:
          - dns-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── 7a. Monitoring Agent ───────────────────────────────────
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports: ["9100:9100"]
    networks:
      cloud-net:
        aliases:
          - node-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  # ── 7b. Monitoring Server ───────────────────────────────────
  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    command: [
      "--config.file=/etc/prometheus/prometheus.yml",
      "--storage.tsdb.path=/prometheus",
      "--storage.tsdb.retention.time=2d",
      "--storage.tsdb.retention.size=256MB"
    ]
    ports: ["9090:9090"]
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      cloud-net:
        aliases:
          - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 112M

  # ── 8. Visualization ───────────────────────────────────────
  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    user: "0"
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      cloud-net:
        aliases:
          - grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M


  # ── 9. API Gateway / Reverse Proxy ─────────────
  api-gateway-proxy-server:
    build: ./proxy
    image: ${DOCKER_USER:-hotensv}/minicloud-proxy:latest
    container_name: api-gateway-proxy-server
    depends_on:
      web-frontend-server1:
        condition: service_started
      web-frontend-server2:
        condition: service_started
      application-backend-server:
        condition: service_started
      db-schema-migration:
        condition: service_completed_successfully
      keycloak-bootstrap:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    ports: ["80:80"]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M
