networks:
  cloud-net:
    name: cloud-net

services:
  # ── 1. Web Frontend Service (Custom Image) ──────────────────────────────────
  web-frontend-server:
    build: ./web
    image: ${DOCKER_USER:-hotensv}/myminicloud-web:latest
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # ── 2. Application Backend (Custom Image) ───────────────────────────────────
  application-backend-server:
    build: ./app
    image: ${DOCKER_USER:-hotensv}/myminicloud-app:latest
    container_name: application-backend-server
    networks: [cloud-net]
    ports: ["8085:8081"]
    environment:
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/master"
      OIDC_AUDIENCE: "myapp"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── 3. Relational Database (Official Image) ─────────────────────────────────
  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    command: [
      "mariadbd",
      "--performance_schema=OFF",
      "--innodb_buffer_pool_size=64M",
      "--innodb_log_buffer_size=8M",
      "--max_connections=20"
    ]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["3306:3306"]
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M

  # ── 4. Authentication / Identity (Official Image) ───────────────────────────
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms64m -Xmx300m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
    ports: ["8081:8080"]
    restart: unless-stopped
    networks: [cloud-net]
    deploy:
      resources:
        limits:
          memory: 450M

  # ── 5. Object Storage (Official Image) ──────────────────────────────────────
  object-storage-server:
    image: minio/minio:latest
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage/data:/data
    ports: ["9000:9000", "9001:9001"]
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── 6. Internal DNS (Official Image) ────────────────────────────────────────
  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports: ["1053:53/udp"]
    volumes:
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # ── 7a. Monitoring Agent (Official Image) ───────────────────────────────────
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports: ["9100:9100"]
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  # ── 7b. Monitoring Server (Official Image) ───────────────────────────────────
  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    command: [
      "--config.file=/etc/prometheus/prometheus.yml",
      "--storage.tsdb.path=/prometheus",
      "--storage.tsdb.retention.time=2d",
      "--storage.tsdb.retention.size=500MB"
    ]
    ports: ["9090:9090"]
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── 8. Visualization (Official Image) ───────────────────────────────────────
  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports: ["3000:3000"]
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── 9. API Gateway / Reverse Proxy (Custom Image hoặc Official) ─────────────
  api-gateway-proxy-server:
    build: ./proxy
    image: ${DOCKER_USER:-hotensv}/myminicloud-proxy:latest
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
      - application-backend-server
      - authentication-identity-server
    ports: ["80:80"]
    networks: [cloud-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
