name: CI/CD Pipeline - MyMiniCloud

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ── JOB 1: BUILD & PUSH DOCKER IMAGES ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myminicloud-web:latest

      - name: Build and Push Backend App Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myminicloud-app:latest

      - name: Build and Push API Gateway Proxy Image
        uses: docker/build-push-action@v5
        with:
          context: ./proxy
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myminicloud-proxy:latest

  # ── JOB 2: DEPLOY TO AWS EC2 ────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Setup SSH Key & Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # 1. Cấu hình SSH private key an toàn
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Thêm host vào known_hosts để tránh hỏi xác nhận fingerprint
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 3. Kết nối SSH và chạy script deploy
          ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no "$USER@$HOST" << 'EOF'
            set -e
            mkdir -p ~/myminicloud
            cd ~/myminicloud

            # Cập nhật username Docker Hub vào .env
            echo "DOCKER_USER=$DOCKERHUB_USERNAME" > .env

            # Pull code mới nhất nếu đã clone repo
            if [ -d .git ]; then
              git pull origin master || git pull origin main || true
            fi

            # Pull images mới nhất và khởi chạy
            docker compose pull
            docker compose up -d --scale web-frontend-server=2 --remove-orphans
          EOF
