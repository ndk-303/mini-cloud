name: CI/CD Pipeline - MyMiniCloud

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ── JOB 1: BUILD & PUSH DOCKER IMAGES ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myminicloud-web:latest

      - name: Build and Push Backend App Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myminicloud-app:latest

      - name: Build and Push API Gateway Proxy Image
        uses: docker/build-push-action@v5
        with:
          context: ./proxy
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myminicloud-proxy:latest

      - name: Build and Push MinIO Storage Image
        uses: docker/build-push-action@v5
        with:
          context: ./storage
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myminicloud-storage:latest

  # ── JOB 2: DEPLOY TO AWS EC2 ────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          mkdir -p ~/.ssh

          # 1. Ghi private key
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Thêm host vào known_hosts
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 3. Tạo thư mục đích trên EC2 và ghi file .env
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "mkdir -p ~/myminicloud && echo 'DOCKER_USER=$DOCKERHUB_USER' > ~/myminicloud/.env"

          # 4. Tự động copy docker-compose.yml và các thư mục config sang EC2
          scp -i ~/.ssh/id_rsa -r docker-compose.yml db dns monitor proxy storage "$USER@$HOST:~/myminicloud/" 2>/dev/null || \
          scp -i ~/.ssh/id_rsa -r docker-compose.yml db dns monitor proxy "$USER@$HOST:~/myminicloud/"

          # 5. Thực hiện pull image và khởi chạy container
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "cd ~/myminicloud && sudo systemctl start docker || true && docker compose pull && docker compose up -d --scale web-frontend-server=2 --remove-orphans"
